version: "3.9"

services:

  # ------------------------------------
  # FASTAPI SERVICE
  # ------------------------------------
  fastapi:
    build: ./fastapi
    container_name: fastapi_ai_service
    ports:
      - "8000:8000"
    restart: always

  # ------------------------------------
  # LARAVEL APPLICATION (NO FULL MOUNT!)
  # ------------------------------------
  laravel:
    build: ./laravel
    container_name: laravel_web_app
    expose:
      - "9000"
    volumes:
      - ./laravel/app:/var/www/app
      - ./laravel/config:/var/www/config
      - ./laravel/storage:/var/www/storage
      - ./laravel/public:/var/www/public
      - ./laravel/bootstrap/cache:/var/www/bootstrap/cache
      - ./laravel/.env:/var/www/.env
    depends_on:
      - mysql
      - fastapi
    restart: always

  # ------------------------------------
  # NGINX
  # ------------------------------------
  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./laravel/public:/var/www/public
    depends_on:
      - laravel
    restart: always

  # ------------------------------------
  # MYSQL DATABASE
  # ------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hamasense
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
