services:

  # ==============================
  # FASTAPI (AI SERVICE)
  # ==============================
  fastapi:
    build: ./fastapi
    container_name: fastapi_ai_service
    expose:
      - "8000"
    env_file:
      - ./fastapi/.env
    volumes:
      - ./fastapi/model_artifacts:/app/model_artifacts:ro
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hamasense_network

  # ==============================
  # LARAVEL (PHP-FPM)
  # ==============================
  laravel:
    build: ./laravel
    container_name: laravel_web_app
    expose:
      - "9000"
    volumes:
      - ./laravel/storage:/var/www/storage
      - ./laravel/bootstrap/cache:/var/www/bootstrap/cache
      - ./laravel/public:/var/www/public
    env_file:
      - ./laravel/.env
    depends_on:
      mysql:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    restart: always
    networks:
      - hamasense_network

  # ==============================
  # NGINX
  # ==============================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./laravel/public:/var/www/public:ro
    depends_on:
      - laravel
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - hamasense_network

  # ==============================
  # MYSQL
  # ==============================
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hamasense}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hamasense_network

networks:
  hamasense_network:
    driver: bridge

volumes:
  mysql_data:
