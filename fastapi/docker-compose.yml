services:
  api:
    build: .
    container_name: pest-disease-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount artefak model & label map dari HOST ke path di DALAM container
      - ./model_artifacts/best_model_finetuned_6class.h5:/srv/app/models/best_model_finetuned_6class.h5:ro
      - ./model_artifacts/class_indices.json:/srv/app/class_indices.json:ro
      # (opsional) hot-reload kode saat dev
      - ./app:/srv/app:rw
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
